<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charity Master</title>
<link rel="icon" href="favicon.png" type="image/png">
<meta name="description" content="Événement caritatif Twitch au profit de l'association Les P'tits Doudous.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Denk+One&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0a0113; --pur:#9b7bf0; --neon:#bc13fe; --blanc:#fff; --site:https://purcharity.github.io; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--blanc); font-family:'Denk One',system-ui,sans-serif; background:var(--ink); overflow-x:hidden; }

  /* fond + voile sombre + coeurs */
  .fond, .voile, .coeurs { position:fixed; inset:0; pointer-events:none; }
  .fond { z-index:-3; background:url('https://purcharity.github.io/fond.jpg') center/cover no-repeat; }
  .voile { z-index:-2; background:radial-gradient(70% 50% at 50% 0%, rgba(188,19,254,.2), transparent 72%), linear-gradient(rgba(5,0,11,.5), rgba(5,0,11,.75)); }
  .coeurs { z-index:-1; overflow:hidden; }
  .coeur { position:absolute; color:var(--pur); filter:drop-shadow(0 0 8px var(--neon)); animation:saut var(--d) ease-in-out var(--r) infinite alternate; }
  .coeur svg { width:100%; height:100%; display:block; }
  @keyframes saut { from { transform:translateY(0) rotate(-8deg); } to { transform:translateY(-40px) rotate(8deg); } }
  @media (prefers-reduced-motion:reduce) { .coeur { animation:none; } }

  .centre { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4rem; padding:2rem; text-align:center; }
  h1 { margin:0; font-size:clamp(2rem,6vw,3.2rem); text-shadow:0 0 18px var(--neon); font-weight:400; }
  p { margin:0; }
  .btn { background:var(--neon); color:#fff; border:0; border-radius:999px; padding:.9rem 1.9rem; font:inherit; font-size:1.1rem; cursor:pointer; text-decoration:none; box-shadow:0 0 22px rgba(188,19,254,.55); }
  .btn.sec { background:transparent; border:2px solid var(--pur); box-shadow:none; font-size:.95rem; padding:.55rem 1.3rem; }
  .btn:focus-visible, .carte:focus-visible, .asso:focus-visible { outline:3px solid #fff; outline-offset:3px; }

  /* en-tête */
  .hero { display:flex; flex-direction:column; align-items:center; gap:1rem; padding:2.5rem 1rem 1rem; text-align:center; }
  .asso { display:flex; flex-direction:column; align-items:center; gap:.5rem; color:inherit; text-decoration:none; }
  .asso img { height:90px; max-width:90vw; object-fit:contain; }
  .asso span { font-size:.9rem; border-bottom:1px solid var(--pur); }
  .logo-main { width:min(420px,80vw); }
  .logo-edition { width:min(260px,60vw); }
  hr { width:min(520px,80%); border:0; height:2px; background:linear-gradient(90deg,transparent,var(--neon),transparent); margin:.5rem 0 0; }

  /* sections et cartes */
  .conteneur { max-width:1100px; margin:0 auto; padding:1rem 1.2rem 2rem; }
  .section h2 { text-align:center; font-weight:400; font-size:1.8rem; margin:2rem 0 .2rem; text-shadow:0 0 14px var(--neon); }
  .compteur { text-align:center; color:var(--pur); font-size:.95rem; margin-bottom:1rem; }
  .liste { display:flex; flex-wrap:wrap; justify-content:center; gap:1.1rem; margin-top:1rem; }
  .carte { width:132px; background:none; border:0; color:inherit; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.5rem; padding:.4rem; }
  .avatar { width:96px; height:96px; border-radius:50%; overflow:hidden; border:3px solid var(--pur); box-shadow:0 0 14px rgba(188,19,254,.6); background:#26014a; display:flex; align-items:center; justify-content:center; font-size:2rem; transition:transform .15s; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .carte:hover .avatar { transform:scale(1.07); border-color:#fff; }
  .nom { font-size:.95rem; overflow-wrap:anywhere; }
  .featured .carte { width:190px; }
  .featured .avatar { width:150px; height:150px; font-size:3rem; }
  .featured .nom { font-size:1.15rem; }

  footer { text-align:center; padding:2rem 1rem 3rem; display:grid; gap:.5rem; color:#d8c9ff; }
  footer a { color:#fff; }
  .bas { display:flex; justify-content:center; padding-bottom:1rem; }

  dialog { border:2px solid var(--neon); border-radius:16px; padding:0; width:min(900px,94vw); background:#14012a; color:#fff; }
  dialog::backdrop { background:rgba(5,0,11,.85); }
  .barre { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.8rem 1.1rem; }
  .barre h3 { margin:0; font-weight:400; }
  .lecteur { aspect-ratio:16/9; width:100%; display:block; border:0; background:#000; }
  .vide { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; padding:1rem; text-align:center; color:var(--pur); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="fond"></div><div class="voile"></div><div class="coeurs" id="coeurs" aria-hidden="true"></div>

<!-- Connexion -->
<main id="ecran-login" class="centre" hidden>
  <h1>PUR CHARITY</h1>
  <button class="btn" id="btn-login">Se connecter avec Twitch</button>
</main>

<!-- Accès refusé -->
<main id="ecran-refuse" class="centre" hidden>
  <h1>Accès refusé</h1>
  <p>Tu n'es pas encore autorisé à rentrer sur ce site.</p>
  <button class="btn sec" id="btn-logout-refuse">Se déconnecter</button>
</main>

<!-- Site -->
<div id="ecran-site" hidden>
  <header class="hero">
    <img class="logo-main" src="logo_purcharity.png" alt="Charity Master">
    <img class="logo-edition" src="https://purcharity.github.io/titre-4eme-edition.png" alt="4ème édition">
    <hr>
  </header>
  <main class="conteneur" id="app"></main>
  <div class="bas"><button class="btn sec" id="btn-logout">Se déconnecter</button></div>
  <footer>
    <p>100 % des dons sont reversés à l'association <a href="https://lesptitsdoudous.org/" target="_blank" rel="noopener">Les P'tits Doudous</a>.</p>
    <p>PUR CHARITY · 4ème édition</p>
  </footer>
</div>

<dialog id="modale">
  <div class="barre"><h3 id="modale-titre"></h3><button class="btn sec" id="btn-fermer">Fermer</button></div>
  <div id="modale-lecteur"></div>
</dialog>

<script>
/* ============ À MODIFIER ============ */
const TWITCH_CLIENT_ID = "zspgwjxcj4oly6g81eha8gsdixxkrv";
const REDIRECT_URI = location.origin + location.pathname;   // identique à l'URL enregistrée sur dev.twitch.tv
const BLOQUES = ["madamepoulpy_"];                          // pseudos Twitch refusés (en minuscules)

/* n = pseudo Twitch, label = nom affiché (facultatif),
   video = lien YouTube "embed" ou fichier .mp4 (facultatif pour le moment) */
const SECTIONS = [
  { titre:"Présentiel", liste:[
    { n:"jualkytv", label:"JualkyTV" }, { n:"azzuria_" }, { n:"weeny__" }, { n:"sahaku__" }, { n:"le_max__" },
    { n:"clodeau" }, { n:"genki42" }, { n:"laeticia_m", label:"Laeticia_M" }, { n:"aresia_v", label:"Aresia" }
  ]},
  { titre:"Distanciel", liste:[
    { n:"stl_angix" }, { n:"crackersmc_" }, { n:"foxienox" }, { n:"liyounee" }, { n:"majordytv" },
    { n:"pyv_bylkaa", label:"PYV_Bylkaa" }, { n:"pyv_kurt", label:"PYV_Kurt" }, { n:"toospycy" }, { n:"whitelupi_" },
    { n:"thewilk_tv" }, { n:"patateyuki" }, { n:"l0xen_" }, { n:"pyv_lonzo" }, { n:"rinlevrai" }, { n:"nekonamc" },
    { n:"gompubx" }, { n:"guiguisan_" }, { n:"hannohi" }, { n:"ilobee" }, { n:"meryyn_" }, { n:"theauu_" },
    { n:"ttquentin" }, { n:"tytynetv" }, { n:"v4lorian" }, { n:"zx_ced" }, { n:"mespiaa" },
    { n:"viife_", label:"Viife" }, { n:"mel20", label:"Mel-20" }, { n:"acostya", label:"Acostya" },
    { n:"batsyrise", label:"Basty" }, { n:"dodgemachina", label:"Dodgemachina" }, { n:"doogbarrow", label:"Doog" },
    { n:"grizouillettv", label:"Grizouille" }, { n:"m_oo_de", label:"Moode" },
    { n:"mrapocalyptiktv", label:"Mr Apo Calyptik" }, { n:"mylanne_clk", label:"Mylanne" },
    { n:"mynethecreator", label:"Myne" }, { n:"osirix_", label:"Osirix" },
    { n:"plumispectre_", label:"Plumispectre" }, { n:"stellabatcave", label:"Stellabatcave" }
  ]}
];
/* ================================== */

const $ = id => document.getElementById(id);
const ECRANS = ["ecran-login", "ecran-refuse", "ecran-site"];
const montrer = id => ECRANS.forEach(e => $(e).hidden = e !== id);

/* coeurs flottants */
(function () {
  const svg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.7-9.6-9.2C.7 8.2 2.4 4.6 5.9 4c2-.3 3.9.6 4.9 2.2h.4C12.2 4.6 14.1 3.7 16.1 4c3.5.6 5.2 4.2 3.5 7.8C19.5 16.3 12 21 12 21z"/></svg>';
  for (let i = 0; i < 16; i++) {
    const c = document.createElement("div");
    c.className = "coeur";
    c.innerHTML = svg;
    const t = 16 + Math.random() * 34;
    c.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${t}px;height:${t}px;opacity:${.25+Math.random()*.4};--d:${3+Math.random()*3}s;--r:-${Math.random()*4}s`;
    $("coeurs").appendChild(c);
  }
})();

/* cartes */
function creerCarte(s) {
  const affiche = s.label || s.n;
  const b = document.createElement("button");
  b.className = "carte";
  b.type = "button";
  b.title = "Voir la vidéo de " + affiche;
  const av = document.createElement("span");
  av.className = "avatar";
  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.src = "https://unavatar.io/twitch/" + encodeURIComponent(s.n) + "?fallback=false";
  img.onerror = () => { img.remove(); av.textContent = affiche.charAt(0).toUpperCase(); };
  av.appendChild(img);
  const nom = document.createElement("span");
  nom.className = "nom";
  nom.textContent = affiche;
  b.append(av, nom);
  b.onclick = () => ouvrirVideo(s, affiche);
  return b;
}

function afficherSite() {
  const app = $("app");
  app.innerHTML = "";
  SECTIONS.forEach(sec => {
    const bloc = document.createElement("section");
    bloc.className = "section " + (sec.classe || "");
    if (sec.titre) {
      bloc.innerHTML = "<h2></h2><p class='compteur'></p>";
      bloc.querySelector("h2").textContent = sec.titre;
      bloc.querySelector(".compteur").textContent = sec.liste.length + (sec.liste.length > 1 ? " chaînes" : " chaîne");
    }
    const l = document.createElement("div");
    l.className = "liste";
    sec.liste.forEach(s => l.appendChild(creerCarte(s)));
    bloc.appendChild(l);
    app.appendChild(bloc);
  });
  montrer("ecran-site");
}

/* vidéo */
function ouvrirVideo(s, affiche) {
  $("modale-titre").textContent = affiche;
  const zone = $("modale-lecteur");
  zone.innerHTML = "";
  let el;
  if (!s.video) {
    el = document.createElement("div");
    el.className = "vide";
    el.textContent = "La vidéo de " + affiche + " arrive bientôt.";
  } else if (/\.(mp4|webm)$/i.test(s.video)) {
    el = document.createElement("video");
    el.className = "lecteur"; el.controls = true; el.autoplay = true; el.src = s.video;
  } else {
    el = document.createElement("iframe");
    el.className = "lecteur"; el.allow = "autoplay; fullscreen"; el.allowFullscreen = true;
    el.src = s.video + (s.video.includes("?") ? "&" : "?") + "autoplay=1";
  }
  zone.appendChild(el);
  $("modale").showModal();
}
const fermer = () => { $("modale").close(); $("modale-lecteur").innerHTML = ""; };

/* connexion Twitch */
function connexion() {
  const state = crypto.randomUUID();
  try { sessionStorage.setItem("twitch_state", state); } catch (e) {}
  location.href = "https://id.twitch.tv/oauth2/authorize?" + new URLSearchParams({
    client_id: TWITCH_CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: "token",
    scope: "", state, force_verify: "true"
  });
}
function deconnexion() {
  try { sessionStorage.removeItem("twitch_token"); } catch (e) {}
  montrer("ecran-login");
}
async function pseudoTwitch(token) {
  const r = await fetch("https://api.twitch.tv/helix/users", {
    headers: { Authorization: "Bearer " + token, "Client-Id": TWITCH_CLIENT_ID }
  });
  if (!r.ok) throw new Error("token invalide");
  return (await r.json()).data[0].login.toLowerCase();
}

async function demarrer() {
  let token = null;
  if (location.hash.includes("access_token")) {
    const h = new URLSearchParams(location.hash.slice(1));
    let attendu = null;
    try { attendu = sessionStorage.getItem("twitch_state"); } catch (e) {}
    if (h.get("state") && h.get("state") === attendu) token = h.get("access_token");
    history.replaceState(null, "", location.pathname);
    if (token) { try { sessionStorage.setItem("twitch_token", token); } catch (e) {} }
  } else {
    try { token = sessionStorage.getItem("twitch_token"); } catch (e) {}
  }
  if (!token) return montrer("ecran-login");
  try {
    const login = await pseudoTwitch(token);
    if (BLOQUES.includes(login)) return montrer("ecran-refuse");
    afficherSite();
  } catch (e) { deconnexion(); }
}

$("btn-login").onclick = connexion;
$("btn-logout").onclick = deconnexion;
$("btn-logout-refuse").onclick = deconnexion;
$("btn-fermer").onclick = fermer;
$("modale").addEventListener("cancel", () => { $("modale-lecteur").innerHTML = ""; });
demarrer();
</script>
</body>
</html>
